<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farejadinhos da Yang</title>
<meta name="description" content="Achadinhos e ofertas selecionadas pela Yang.">
<meta property="og:title" content="Farejadinhos da Yang 🐶">
<meta property="og:description" content="Achadinhos e ofertas selecionadas pela Yang.">
<meta property="og:image" content="assets/og-padrao.png">
<meta property="og:type" content="website">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f6f6f6;color:#222}
.wrap{max-width:720px;margin:auto;padding:28px 18px}
.card{background:#fff;border-radius:22px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{margin:0 0 8px;font-size:30px;text-align:center}
.sub{color:#666;margin:0 0 26px;text-align:center}
.btn{display:block;text-align:center;background:#e5232e;color:#fff;text-decoration:none;padding:15px;border-radius:13px;font-weight:700;margin-top:10px}
.small{font-size:13px;color:#777;text-align:center;margin-top:18px}

.destaquesTitulo{font-size:18px;font-weight:900;margin:30px 0 14px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:10px}
.produtoCard{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.08);text-decoration:none;color:#222;display:flex;flex-direction:column}
.produtoCard img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f0f0f0}
.produtoCard .info{padding:12px}
.produtoCard h3{font-size:13px;margin:0 0 6px;line-height:1.3;min-height:34px}
.produtoCard .old{font-size:11px;color:#999;text-decoration:line-through}
.produtoCard .preco{font-size:17px;font-weight:900}
.semDestaque{text-align:center;color:#888;font-size:14px;margin:20px 0}
</style>
</head>
<body>
<div class="wrap">
<div class="card">

<h1>🐶 Farejadinhos da Yang</h1>
<p class="sub">Achadinhos bons de verdade.</p>

<div class="destaquesTitulo">⭐ Destaques de hoje</div>
<div class="grid" id="grid"></div>
<div class="semDestaque" id="semDestaque" style="display:none">Nenhum destaque agora — mas o catálogo completo está cheio de ofertas.</div>

<a class="btn" href="ofertas/">Ver todas as ofertas</a>

<p class="small">Alguns links podem ser de afiliado.</p>

</div>
</div>

<script>

function escapeHtml(texto){
  const div = document.createElement("div");
  div.textContent = texto == null ? "" : texto;
  return div.innerHTML;
}

async function carregarDestaques(){

  let todas = [];

  try{
    const resp = await fetch("ofertas.json", { cache: "no-store" });
    todas = await resp.json();
  }catch(e){
    todas = [];
  }

  if(!Array.isArray(todas)){
    todas = [todas];
  }

  const agora = new Date();

  const destaques = todas.filter(o => {
    if(!o.destaque) return false;
    const dataOferta = new Date(o.data);
    if(isNaN(dataOferta)) return true;
    const horas = (agora - dataOferta) / (1000 * 60 * 60);
    return horas <= 24;
  });

  destaques.sort((a, b) => new Date(b.data) - new Date(a.data));

  const grid = document.getElementById("grid");
  const semDestaque = document.getElementById("semDestaque");

  if(destaques.length === 0){
    semDestaque.style.display = "block";
    return;
  }

  grid.innerHTML = destaques.map(o => {

    const oldHtml = o.precoAntigo
      ? `<div class="old">${escapeHtml(o.precoAntigo)}</div>`
      : "";

    return `
      <a class="produtoCard" href="${o.url}">
        <img src="assets/${encodeURIComponent(o.imagem)}" alt="${escapeHtml(o.produto)}" loading="lazy">
        <div class="info">
          <h3>${escapeHtml(o.produto)}</h3>
          ${oldHtml}
          <div class="preco">${escapeHtml(o.preco)}</div>
        </div>
      </a>
    `;
  }).join("");
}

carregarDestaques();

</script>

</body>
</html>
