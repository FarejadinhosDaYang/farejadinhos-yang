<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔥 Ofertas | Farejadinhos da Yang</title>
<meta name="description" content="Todas as ofertas selecionadas pelo Farejadinhos da Yang.">
<meta property="og:type" content="website">
<meta property="og:title" content="🔥 Ofertas | Farejadinhos da Yang">
<meta property="og:description" content="Confira todos os achadinhos selecionados pela Yang.">
<meta property="og:image" content="../assets/og-padrao.svg">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f4f4;font-family:Arial,sans-serif;color:#222}
.header{background:#e5232e;color:#fff;padding:24px 16px;text-align:center}
.header h1{margin:0;font-size:22px}
.header p{margin:6px 0 0;opacity:.9;font-size:14px}
.wrap{max-width:960px;margin:auto;padding:18px}
.busca{width:100%;padding:13px;border-radius:12px;border:1px solid #ddd;font-size:15px;margin-bottom:18px;outline:none}
.busca:focus{border-color:#e5232e}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.08);display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f0f0f0;display:block}
.card .info{padding:14px;display:flex;flex-direction:column;flex:1}
.card h3{font-size:15px;margin:0 0 8px;line-height:1.3;min-height:39px}
.old{font-size:13px;color:#999;text-decoration:line-through}
.preco{font-size:20px;font-weight:900;margin:2px 0 8px}
.cupom{display:inline-block;font-size:11px;font-weight:700;background:#fff6f6;border:1px dashed #e5232e;color:#e5232e;padding:3px 8px;border-radius:8px;margin-bottom:10px;align-self:flex-start}
.botoes{margin-top:auto;display:flex;gap:8px}
.botoes a,.botoes button{flex:1;text-align:center;padding:10px;border-radius:10px;font-size:13px;font-weight:800;border:0;cursor:pointer;text-decoration:none;font-family:inherit}
.abrir{background:#e5232e;color:#fff}
.copiar{background:#f1f1f1;color:#222}
.vazio{text-align:center;color:#888;padding:50px 0}
</style>
</head>
<body>

<div class="header">
<h1>🐶 Farejadinhos da Yang</h1>
<p>🔥 Todos os achadinhos, em um só lugar</p>
</div>

<div class="wrap">

<input class="busca" id="busca" type="text" placeholder="Buscar produto...">

<div class="grid" id="grid"></div>

<div class="vazio" id="vazio" style="display:none">Nenhuma oferta encontrada ainda.</div>

</div>

<script>

let ofertas = [];

function escapeHtml(texto){
  const div = document.createElement("div");
  div.textContent = texto == null ? "" : texto;
  return div.innerHTML;
}

async function carregar(){

  try{
    const resp = await fetch("../ofertas.json", { cache: "no-store" });
    ofertas = await resp.json();
  }catch(e){
    ofertas = [];
  }

  if(!Array.isArray(ofertas)){
    ofertas = [ofertas];
  }

  ofertas.sort((a, b) => new Date(b.data) - new Date(a.data));

  render(ofertas);
}

function render(lista){

  const grid = document.getElementById("grid");
  const vazio = document.getElementById("vazio");

  grid.innerHTML = "";

  if(lista.length === 0){
    vazio.style.display = "block";
    return;
  }

  vazio.style.display = "none";

  lista.forEach(o => {

    const card = document.createElement("div");
    card.className = "card";

    const oldHtml = o.precoAntigo
      ? `<div class="old">${escapeHtml(o.precoAntigo)}</div>`
      : "";

    const cupomHtml = o.cupom
      ? `<div class="cupom">🏷️ ${escapeHtml(o.cupom)}</div>`
      : "";

    card.innerHTML = `
      <img src="../assets/${encodeURIComponent(o.imagem)}" alt="${escapeHtml(o.produto)}" loading="lazy">
      <div class="info">
        <h3>${escapeHtml(o.produto)}</h3>
        ${oldHtml}
        <div class="preco">${escapeHtml(o.preco)}</div>
        ${cupomHtml}
        <div class="botoes">
          <a class="abrir" href="${o.url}">Abrir oferta</a>
          <button class="copiar" type="button">Copiar link</button>
        </div>
      </div>
    `;

    card.querySelector(".copiar").addEventListener("click", function(){
      const botao = this;
      navigator.clipboard.writeText(o.link).then(() => {
        const original = botao.textContent;
        botao.textContent = "Copiado!";
        setTimeout(() => { botao.textContent = original; }, 1500);
      });
    });

    grid.appendChild(card);
  });
}

document.getElementById("busca").addEventListener("input", function(){
  const termo = this.value.toLowerCase();
  render(ofertas.filter(o => (o.produto || "").toLowerCase().includes(termo)));
});

carregar();

</script>

</body>
</html>
