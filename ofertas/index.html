<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔥 Ofertas | Farejadinhos da Yang</title>
<meta name="description" content="Todas as ofertas selecionadas pelo Farejadinhos da Yang.">
<meta property="og:type" content="website">
<meta property="og:title" content="🔥 Ofertas | Farejadinhos da Yang">
<meta property="og:description" content="Confira todos os achadinhos selecionados pela Yang.">
<meta property="og:image" content="../assets/og-padrao.png">

<link rel="icon" href="../assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/nav.css">

<style>
:root{
    --red:#E5232E;
    --red-dark:#C21A24;
    --orange:#F7941D;
    --cream:#FDF3E3;
    --cream-2:#FFFAF1;
    --ink:#2B1B12;
    --muted:#8A7563;
    --line:#F0DFC4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);font-family:'Work Sans',Arial,sans-serif;color:var(--ink)}
.header{background:linear-gradient(120deg,var(--red) 0%,#f0462f 60%,var(--orange) 140%);color:#fff;padding:22px 16px;text-align:center;position:relative}
.header-top{display:flex;align-items:center;justify-content:space-between;max-width:960px;margin:0 auto 10px}
.header-brand{display:flex;align-items:center;gap:10px}
.header-brand img{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.header-brand b{font-family:'Baloo 2',sans-serif;font-size:15px}
.header h1{margin:0;font-size:22px;font-family:'Baloo 2',sans-serif}
.header p{margin:6px 0 0;opacity:.9;font-size:14px}
.wrap{max-width:960px;margin:auto;padding:18px}
.busca{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;margin-bottom:14px;outline:none;font-family:'Work Sans',sans-serif;background:var(--cream-2);color:var(--ink)}
.busca:focus{border-color:var(--red)}
.categorias{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.categoriaBtn{padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--cream-2);color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;font-family:'Work Sans',sans-serif}
.categoriaBtn.ativa{background:var(--red);border-color:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--cream-2);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(43,27,18,.08);display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f0e6d6;display:block}
.card .info{padding:14px;display:flex;flex-direction:column;flex:1}
.card h3{font-size:15px;margin:0 0 8px;line-height:1.3;min-height:39px;font-family:'Work Sans',sans-serif;font-weight:600}
.tagCategoria{display:inline-block;font-size:10px;font-weight:700;background:#f7f1e6;color:var(--muted);padding:3px 8px;border-radius:8px;margin-bottom:8px;align-self:flex-start;text-transform:uppercase;letter-spacing:.3px}
.old{font-size:13px;color:var(--muted);text-decoration:line-through}
.preco{font-size:20px;font-weight:800;margin:2px 0 8px;font-family:'Baloo 2',sans-serif;color:var(--red-dark)}
.cupom{display:inline-block;font-size:11px;font-weight:700;background:#fff6e9;border:1px dashed var(--orange);color:var(--red-dark);padding:3px 8px;border-radius:8px;margin-bottom:10px;align-self:flex-start}
.botoes{margin-top:auto;display:flex;gap:8px}
.botoes a,.botoes button{flex:1;text-align:center;padding:10px;border-radius:10px;font-size:13px;font-weight:800;border:0;cursor:pointer;text-decoration:none;font-family:'Work Sans',sans-serif}
.abrir{background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff}
.copiar{background:#f7f1e6;color:var(--ink)}
.vazio{text-align:center;color:var(--muted);padding:50px 0}
</style>
</head>
<body>

<div class="header">
<div class="header-top">
<a href="../" class="header-brand" style="text-decoration:none;color:inherit">
<img src="../assets/yang-badge.png" alt="Yang">
<b>Farejadinhos da Yang</b>
</a>
<div data-yang-nav data-base="../"></div>
</div>
<h1>🔥 Todos os achadinhos</h1>
<p>Tudo que a Yang farejou, em um só lugar</p>
</div>

<div class="wrap">

<input class="busca" id="busca" type="text" placeholder="Buscar produto...">

<div class="categorias" id="categorias"></div>

<div class="grid" id="grid"></div>

<div class="vazio" id="vazio" style="display:none">Nenhuma oferta encontrada com esse filtro.</div>

</div>

<script src="../assets/nav.js"></script>
<script>

const HORAS_EXPIRACAO = 24;

let ofertas = [];
let categoriaAtual = "";

function escapeHtml(texto){
  const div = document.createElement("div");
  div.textContent = texto == null ? "" : texto;
  return div.innerHTML;
}

async function carregar(){

  let todas = [];

  try{
    const resp = await fetch("../ofertas.json", { cache: "no-store" });
    todas = await resp.json();
  }catch(e){
    todas = [];
  }

  if(!Array.isArray(todas)){
    todas = [todas];
  }

  // Ofertas somem do catálogo depois de 24h (o link direto continua
  // funcionando normalmente, só não aparece mais aqui na listagem).
  const agora = new Date();

  ofertas = todas.filter(o => {
    const dataOferta = new Date(o.data);
    if(isNaN(dataOferta)) return true;
    const horasPassadas = (agora - dataOferta) / (1000 * 60 * 60);
    return horasPassadas <= HORAS_EXPIRACAO;
  });

  ofertas.sort((a, b) => new Date(b.data) - new Date(a.data));

  montarCategorias();
  aplicarFiltros();
}

function montarCategorias(){

  const container = document.getElementById("categorias");

  const categorias = [...new Set(
    ofertas.map(o => (o.categoria || "").trim()).filter(c => c !== "")
  )].sort();

  if(categorias.length === 0){
    container.innerHTML = "";
    return;
  }

  let html = `<button type="button" class="categoriaBtn ativa" data-categoria="">Todas</button>`;

  categorias.forEach(c => {
    html += `<button type="button" class="categoriaBtn" data-categoria="${escapeHtml(c)}">${escapeHtml(c)}</button>`;
  });

  container.innerHTML = html;

  container.querySelectorAll(".categoriaBtn").forEach(btn => {
    btn.addEventListener("click", function(){
      categoriaAtual = this.dataset.categoria;
      container.querySelectorAll(".categoriaBtn").forEach(b => b.classList.remove("ativa"));
      this.classList.add("ativa");
      aplicarFiltros();
    });
  });
}

function aplicarFiltros(){

  const termo = document.getElementById("busca").value.toLowerCase();

  const filtradas = ofertas.filter(o => {
    const bateBusca = (o.produto || "").toLowerCase().includes(termo);
    const bateCategoria = !categoriaAtual || (o.categoria || "") === categoriaAtual;
    return bateBusca && bateCategoria;
  });

  render(filtradas);
}

function render(lista){

  const grid = document.getElementById("grid");
  const vazio = document.getElementById("vazio");

  grid.innerHTML = "";

  if(lista.length === 0){
    vazio.style.display = "block";
    return;
  }

  vazio.style.display = "none";

  lista.forEach(o => {

    const card = document.createElement("div");
    card.className = "card";

    const oldHtml = o.precoAntigo
      ? `<div class="old">${escapeHtml(o.precoAntigo)}</div>`
      : "";

    const cupomHtml = o.cupom
      ? `<div class="cupom">🏷️ ${escapeHtml(o.cupom)}</div>`
      : "";

    const categoriaHtml = o.categoria
      ? `<div class="tagCategoria">${escapeHtml(o.categoria)}</div>`
      : "";

    card.innerHTML = `
      <img src="../assets/${encodeURIComponent(o.imagem)}" alt="${escapeHtml(o.produto)}" loading="lazy">
      <div class="info">
        ${categoriaHtml}
        <h3>${escapeHtml(o.produto)}</h3>
        ${oldHtml}
        <div class="preco">${escapeHtml(o.preco)}</div>
        ${cupomHtml}
        <div class="botoes">
          <a class="abrir" href="${o.url}">Abrir oferta</a>
          <button class="copiar" type="button">Copiar link</button>
        </div>
      </div>
    `;

    card.querySelector(".copiar").addEventListener("click", function(){
      const botao = this;
      navigator.clipboard.writeText(o.link).then(() => {
        const original = botao.textContent;
        botao.textContent = "Copiado!";
        setTimeout(() => { botao.textContent = original; }, 1500);
      });
    });

    grid.appendChild(card);
  });
}

document.getElementById("busca").addEventListener("input", aplicarFiltros);

carregar();

</script>

</body>
</html>
