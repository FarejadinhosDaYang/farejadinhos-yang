name: Gerar lote de ofertas

on:
  workflow_dispatch:
    inputs:
      arquivoLote:
        description: "Caminho do arquivo JSON do lote (em entrada/)"
        required: true
        type: string

permissions:
  contents: write
  actions: write   # pra poder disparar o "Stories do dia" quando o painel pedir

jobs:
  gerar-lote:
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Pedido de stories do dia (botao do painel)
        shell: pwsh
        env:
          ARQUIVO_LOTE: ${{ inputs.arquivoLote }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $texto = Get-Content -LiteralPath $env:ARQUIVO_LOTE -Raw -Encoding UTF8
          if ($texto -match '"acao"\s*:\s*"stories"') {
            gh workflow run stories-do-dia.yml --ref main
            Write-Host "Pedido de stories enviado pro workflow 'Stories do dia'."
          }
          if ($texto -match '"acao"\s*:\s*"conferir-precos"') {
            gh workflow run conferir-precos.yml --ref main
            Write-Host "Pedido de conferencia de precos enviado pro workflow 'Conferir precos'."
          }

      - name: Pillow (fotos leves)
        shell: pwsh
        run: python -m pip install -q pillow

      # Lote "só links" ({"acao": "links", "links": [...]}): busca nome,
      # preço e foto de cada link no Worker e vira um lote comum.
      - name: Links -> itens do lote
        shell: pwsh
        env:
          ARQUIVO_LOTE: ${{ inputs.arquivoLote }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
        run: |
          $texto = Get-Content -LiteralPath $env:ARQUIVO_LOTE -Raw -Encoding UTF8
          if ($texto -match '"acao"\s*:\s*"links"') {
            node gerador/links_para_lote.js $env:ARQUIVO_LOTE
            if ($LASTEXITCODE -ne 0) { throw "links_para_lote.js falhou" }
          }

      # Lote "mais do mesmo tipo" ({"acao": "mais-do-tipo", "tipos": [...]}):
      # procura os mais vendidos de cada tipo na Shopee e vira um lote comum.
      - name: Mais do tipo -> itens do lote
        shell: pwsh
        env:
          ARQUIVO_LOTE: ${{ inputs.arquivoLote }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          PYTHONIOENCODING: utf-8
        run: |
          $texto = Get-Content -LiteralPath $env:ARQUIVO_LOTE -Raw -Encoding UTF8
          if ($texto -match '"acao"\s*:\s*"mais-do-tipo"') {
            python gerador/mais_do_tipo.py $env:ARQUIVO_LOTE
            if ($LASTEXITCODE -ne 0) { throw "mais_do_tipo.py falhou" }
          }

      # Processa e salva numa tacada só. Se outro lote salvou no meio do
      # caminho (vários pedidos do painel ao mesmo tempo), descarta, pega a
      # versão mais nova do site e processa de novo — nada se perde.
      - name: Processar o lote e salvar no GitHub
        shell: pwsh
        env:
          ARQUIVO_LOTE: ${{ inputs.arquivoLote }}
        run: |
          $Arq = $env:ARQUIVO_LOTE
          $Copia = Join-Path $env:RUNNER_TEMP "lote-original.json"
          Copy-Item -LiteralPath $Arq -Destination $Copia -Force

          function Processar {
            if (-not (Test-Path -LiteralPath $Arq)) { Copy-Item -LiteralPath $Copia -Destination $Arq -Force }
            $texto = Get-Content -LiteralPath $Arq -Raw -Encoding UTF8
            if ($texto -match '"acao"\s*:\s*"anuncios"') {
              python gerador/anuncios.py $Arq
              if ($LASTEXITCODE -ne 0) { throw "anuncios.py falhou" }
            }
            if ($texto -match '"acao"\s*:\s*"categorias"') {
              python gerador/categorias_config.py $Arq
              if ($LASTEXITCODE -ne 0) { throw "categorias_config.py falhou" }
            }
            if ($texto -match '"acao"\s*:\s*"cupons-site"') {
              python gerador/cupons_site.py $Arq
              if ($LASTEXITCODE -ne 0) { throw "cupons_site.py falhou" }
            }
            if ($texto -match '"acao"\s*:\s*"liberar-fila"') {
              python gerador/liberar_fila.py $Arq
              if ($LASTEXITCODE -ne 0) { throw "liberar_fila.py falhou" }
            }
            & .\gerador\gerar-lote.ps1 -ArquivoLote $Arq
            # fotos novas ficam leves (máx. 1000px, mesma qualidade visual)
            $novas = @(git ls-files --others --exclude-standard assets | Where-Object { $_ -match '\.(jpe?g|png|webp)$' })
            if ($novas.Count) { python gerador/fotos_leves.py @novas }
            python gerador/seo.py
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $Salvou = $false
          for ($t = 1; $t -le 6; $t++) {
            Write-Host "== tentativa $t =="
            Processar
            git add assets ofertas entrada ofertas.json
            if (Test-Path cupons.json) { git add cupons.json }
            if (Test-Path precos/fora-por-preco.json) { git add precos/fora-por-preco.json }
            if (Test-Path sitemap.xml) { git add sitemap.xml robots.txt }
            if ([string]::IsNullOrWhiteSpace((git status --porcelain assets ofertas entrada ofertas.json cupons.json precos/fora-por-preco.json sitemap.xml robots.txt))) {
              Write-Host "Nada para commitar."; $Salvou = $true; break
            }
            git commit -q -m "Lote de ofertas importado"
            git push -q origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $Salvou = $true; break }
            Write-Host "Outro lote salvou antes; refazendo em cima da versao nova..."
            git fetch -q origin main
            git reset -q --hard origin/main
            git clean -fdq assets ofertas entrada
            Start-Sleep -Seconds (Get-Random -Minimum 4 -Maximum 15)
          }
          if (-not $Salvou) { throw "Nao consegui salvar o lote depois de 6 tentativas." }
