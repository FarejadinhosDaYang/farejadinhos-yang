name: Gerar lote de ofertas

on:
  workflow_dispatch:
    inputs:
      arquivoLote:
        description: "Caminho do arquivo JSON do lote (em entrada/)"
        required: true
        type: string

permissions:
  contents: write
  actions: write   # pra poder disparar o "Stories do dia" quando o painel pedir

jobs:
  gerar-lote:
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Pedido de stories do dia (botao do painel)
        shell: pwsh
        env:
          ARQUIVO_LOTE: ${{ inputs.arquivoLote }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $texto = Get-Content -LiteralPath $env:ARQUIVO_LOTE -Raw -Encoding UTF8
          if ($texto -match '"acao"\s*:\s*"stories"') {
            gh workflow run stories-do-dia.yml --ref main
            Write-Host "Pedido de stories enviado pro workflow 'Stories do dia'."
          }
          if ($texto -match '"acao"\s*:\s*"conferir-precos"') {
            gh workflow run conferir-precos.yml --ref main
            Write-Host "Pedido de conferencia de precos enviado pro workflow 'Conferir precos'."
          }

      - name: Outros anuncios de uma oferta (comparador, botao do painel)
        shell: pwsh
        env:
          ARQUIVO_LOTE: ${{ inputs.arquivoLote }}
        run: |
          $texto = Get-Content -LiteralPath $env:ARQUIVO_LOTE -Raw -Encoding UTF8
          if ($texto -match '"acao"\s*:\s*"anuncios"') {
            python gerador/anuncios.py $env:ARQUIVO_LOTE
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Gerar ofertas do lote
        shell: pwsh
        env:
          ARQUIVO_LOTE: ${{ inputs.arquivoLote }}
        run: |
          .\gerador\gerar-lote.ps1 -ArquivoLote $env:ARQUIVO_LOTE

      - name: Salvar no GitHub
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets ofertas entrada ofertas.json

          $temAlteracoes = git status --porcelain

          if ([string]::IsNullOrWhiteSpace($temAlteracoes)) {
            Write-Host "Nada para commitar."
          } else {
            git commit -m "Lote de ofertas importado"
            for ($i = 0; $i -lt 4; $i++) {
              git pull --rebase
              git push
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds (5 * ($i + 1))
            }
          }
