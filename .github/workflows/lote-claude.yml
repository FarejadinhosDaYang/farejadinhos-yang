name: Lote enviado pelo Claude

# Jeito do Claude subir ofertas sem a senha do painel: ele grava um arquivo de lote
# (mesmo formato do painel/radar) em entrada/claude/ e este workflow manda o
# "Gerar lote de ofertas" processar — igual ao botão "🚀 Subir no site".
on:
  push:
    branches: [main]
    paths:
      - "entrada/claude/*.json"

permissions:
  contents: read
  actions: write

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mandar cada lote novo pro Gerar lote
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ANTES: ${{ github.event.before }}
        run: |
          # arquivos de lote que entraram neste push (o "added" do evento nem sempre vem preenchido)
          if git cat-file -e "$ANTES" 2>/dev/null; then
            git diff --name-only --diff-filter=A "$ANTES" "$GITHUB_SHA" -- 'entrada/claude/*.json' > novos.txt
          else
            git show --name-only --diff-filter=A --format= "$GITHUB_SHA" -- 'entrada/claude/*.json' > novos.txt
          fi
          cat novos.txt
          while read -r arq; do
            [ -n "$arq" ] || continue
            gh workflow run gerar-lote.yml --ref main -f arquivoLote="$arq"
            echo "Disparado: $arq"
          done < novos.txt
