name: Checar Workers

# Confere se os Workers da Cloudflare estão no ar e com o código novo.
on:
  workflow_dispatch:

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Testar rotas
        run: |
          O="Origin: https://farejadinhosdayang.com.br"
          t() { echo "== $1 $2"; curl -s -m 20 -X "$1" -H "$O" -H "Content-Type: text/plain" ${3:+-d "$3"} "$2" -w "  [HTTP %{http_code}]\n" | head -c 600; echo; }
          t POST https://farejadinhos-push.bernard-shimizu.workers.dev/alertas '{"endpoint":"https://teste.invalido/x"}'
          t GET  https://farejadinhos-push.bernard-shimizu.workers.dev/chave
          t GET  "https://farejadinhos-contador.bernard-shimizu.workers.dev/relatorio?dias=1"
          t GET  https://farejadinhos-contador.bernard-shimizu.workers.dev/numeros
          t GET  https://farejadinhos-reels.bernard-shimizu.workers.dev/
      - name: Testar sitemap e robots do site
        run: |
          for u in sitemap.xml robots.txt google061fe68eba0e64b9.html; do
            echo "== $u"; curl -s -m 20 -A "Googlebot/2.1" -D - "https://farejadinhosdayang.com.br/$u" -o /tmp/r | grep -iE "^HTTP|content-type"; head -c 300 /tmp/r; echo; grep -c "<url>" /tmp/r || true
          done
