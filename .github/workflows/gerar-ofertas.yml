name: Gerar oferta

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Gerar oferta de teste
        shell: pwsh
        run: |
          .\gerador\gerar-oferta.ps1 `
            -Produto "Oferta de Teste Yang" `
            -Preco "29,90" `
            -PrecoAntigo "49,90" `
            -Cupom "YANG10" `
            -Link "https://example.com" `
            -Imagem ".\teste\produto-teste.png"
            -Slug "oferta-de-teste-yang"

      - name: Mostrar resultado
        shell: pwsh
        run: |
          Write-Host "Arquivos gerados:"
          Get-ChildItem ".\ofertas\oferta-de-teste-yang" -Recurse

      - name: Salvar no GitHub
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets ofertas

          git commit -m "Teste: gera oferta automaticamente"

          git push