name: Gerar oferta

on:
  workflow_dispatch:
    inputs:
      produto:
        description: "Nome do produto"
        required: true
        type: string

      preco:
        description: "Preço"
        required: true
        type: string

      precoAntigo:
        description: "Preço antigo"
        required: false
        type: string

      cupom:
        description: "Cupom"
        required: false
        type: string

      link:
        description: "Link da oferta"
        required: true
        type: string

      imagem:
        description: "Caminho da imagem"
        required: true
        type: string

      slug:
        description: "Slug da oferta"
        required: true
        type: string

permissions:
  contents: write

jobs:
  gerar:
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Gerar oferta
        shell: pwsh
        env:
          PRODUTO: ${{ inputs.produto }}
          PRECO: ${{ inputs.preco }}
          PRECO_ANTIGO: ${{ inputs.precoAntigo }}
          CUPOM: ${{ inputs.cupom }}
          LINK: ${{ inputs.link }}
          IMAGEM: ${{ inputs.imagem }}
          SLUG: ${{ inputs.slug }}
        run: |
          & ".\gerador\gerar-oferta.ps1" `
            -Produto "$env:PRODUTO" `
            -Preco "$env:PRECO" `
            -PrecoAntigo "$env:PRECO_ANTIGO" `
            -Cupom "$env:CUPOM" `
            -Link "$env:LINK" `
            -Imagem "$env:IMAGEM" `
            -Slug "$env:SLUG"

      - name: Remover imagem temporaria
        shell: pwsh
        env:
          IMAGEM: ${{ inputs.imagem }}
        run: |
          if (Test-Path -LiteralPath $env:IMAGEM) {
            Remove-Item -LiteralPath $env:IMAGEM -Force
            Write-Host "Imagem temporaria removida."
          }

      - name: Salvar no GitHub
        shell: pwsh
        env:
          PRODUTO: ${{ inputs.produto }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets ofertas entrada ofertas.json

          $temAlteracoes = git status --porcelain

          if ([string]::IsNullOrWhiteSpace($temAlteracoes)) {
            Write-Host "Nada para commitar."
          } else {
            git commit -m "Nova oferta: $env:PRODUTO"
            git push
          }
