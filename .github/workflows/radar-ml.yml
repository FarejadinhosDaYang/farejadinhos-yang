name: Radar do Mercado Livre

# Lê as páginas públicas de "Mais vendidos" do Mercado Livre e atualiza radar/radar-ml.json.
# Roda também quando o arquivo radar/ml-pedido.txt muda (jeito de disparar pelo próprio repositório).
on:
  push:
    paths:
      - "radar/ml-pedido.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-ml
  cancel-in-progress: false

jobs:
  radar-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Testar paginas do Mercado Livre
        run: python3 gerador/ml_teste_paginas.py

      - name: Salvar no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar/ml-teste
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Teste das paginas do Mercado Livre"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
