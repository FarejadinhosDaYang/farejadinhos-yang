name: Radar da Yang

# Todo dia de manhã pesquisa os mais vendidos da Shopee (API de afiliados) e
# atualiza radar/radar.json, que aparece no painel em "🔎 Radar da Yang".
on:
  schedule:
    - cron: "43 9 * * *"     # 06:43 em Brasília
  workflow_dispatch:
    inputs:
      teste:
        description: "Só testar a API da Shopee (não grava o radar)"
        required: false
        type: boolean
        default: false
      teste_ml:
        description: "Só testar a API do Mercado Livre (grava radar/teste-ml.json)"
        required: false
        type: boolean
        default: false
      codigo_ml:
        description: "Código do 'Autorizar' do Mercado Livre (TG-...) pra testar com login"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: radar-shopee
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Testar API do Mercado Livre
        if: ${{ inputs.teste_ml == true }}
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: python3 gerador/ml_api.py teste

      - name: Testar Mercado Livre com login (codigo do Autorizar)
        if: ${{ inputs.codigo_ml != '' }}
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          CODIGO_ML: ${{ inputs.codigo_ml }}
        run: python3 gerador/ml_api.py login "$CODIGO_ML"

      - name: Pesquisar mais vendidos na Shopee
        if: ${{ inputs.teste_ml != true && inputs.codigo_ml == '' }}
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          if [ "${{ inputs.teste }}" = "true" ]; then
            python3 gerador/radar_shopee.py --teste
          else
            python3 gerador/radar_shopee.py
          fi

      - name: Salvar no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in radar/radar.json radar/ml-status.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Radar da Yang atualizado"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
