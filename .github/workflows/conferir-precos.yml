name: Conferir precos

on:
  schedule:
    # de hora em hora, no minuto 17 (fora do "minuto zero", que atrasa)
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      teste_shopee:
        description: "Só testar a API da Shopee (5 links, não muda preço)"
        required: false
        default: "false"

permissions:
  contents: write

# Nunca duas conferencias ao mesmo tempo
concurrency:
  group: conferir-precos
  cancel-in-progress: true

jobs:
  conferir:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Conferir precos na loja
        shell: pwsh
        env:
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          SHOPEE_TESTE: ${{ inputs.teste_shopee }}
        run: |
          .\gerador\conferir-precos.ps1

      - name: Conferir os outros anuncios (comparador)
        shell: pwsh
        env:
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          python gerador/conferir-anuncios.py

      - name: Salvar no GitHub
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ofertas ofertas.json
          # lista de preços barrados (só muda quando aparece/some um suspeito)
          git add precos/suspeitos.json
          # códigos dos produtos da Shopee (pra API não precisar abrir o link toda vez)
          if (Test-Path precos/shopee-ids.json) { git add precos/shopee-ids.json }
          # relatório: sempre que o botão pedir, ou quando algum preço mudou
          $mudouOferta = git status --porcelain ofertas ofertas.json precos/suspeitos.json
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -or -not [string]::IsNullOrWhiteSpace($mudouOferta)) {
            git add precos
          }

          $temAlteracoes = git diff --cached --name-only

          if ([string]::IsNullOrWhiteSpace($temAlteracoes)) {
            Write-Host "Nenhum preco mudou."
          } else {
            git commit -m "Precos conferidos automaticamente"
            # descarta o que não entrou no commit (ex.: relatório da rodada de hora em hora)
            git checkout -- .
            git clean -fdq precos
            for ($i = 0; $i -lt 3; $i++) {
              git pull --rebase
              git push
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 10
            }
          }
