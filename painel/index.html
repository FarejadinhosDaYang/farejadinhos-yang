<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farejadinhos da Yang</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#f4f4f4;
    font-family:Arial,sans-serif;
    color:#222;
}

.container{
    max-width:600px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:24px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    font-size:24px;
    font-weight:900;
    margin-bottom:6px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:700;
    margin-top:16px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#e5232e;
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:16px;
    margin-top:24px;
    background:#e5232e;
    color:white;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
}

button:hover{
    opacity:.92;
}

button:disabled{
    opacity:.6;
    cursor:wait;
}

.optional{
    color:#888;
    font-size:13px;
    font-weight:normal;
}

.status{
    display:none;
    margin-top:20px;
    padding:14px;
    border-radius:10px;
    background:#f1f1f1;
    text-align:center;
    word-break:break-word;
}

.resultado{
    display:none;
    margin-top:20px;
    padding:16px;
    border-radius:12px;
    background:#eef9ee;
}

.resultado a{
    display:block;
    margin-top:10px;
    color:#e5232e;
    font-weight:700;
    word-break:break-all;
}

.erro{
    background:#fff0f0;
    color:#b00000;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
🐶 FAREJADINHOS DA YANG
</div>

<div class="subtitle">
Gerador de ofertas
</div>

<form id="ofertaForm">

<label>
Produto
</label>

<input
    type="text"
    id="produto"
    placeholder="Ex.: Air Fryer Mondial 4L"
    required
>

<label>
Preço
</label>

<input
    type="text"
    id="preco"
    placeholder="Ex.: 38,80"
    required
>

<label>
Preço antigo
<span class="optional">(opcional)</span>
</label>

<input
    type="text"
    id="precoAntigo"
    placeholder="Ex.: 59,90"
>

<label>
Cupom
<span class="optional">(opcional)</span>
</label>

<input
    type="text"
    id="cupom"
    placeholder="Ex.: YANG10"
>

<label>
Link da oferta
</label>

<input
    type="url"
    id="link"
    placeholder="https://..."
    required
>

<label>
Imagem
</label>

<input
    type="file"
    id="imagem"
    accept="image/*"
    required
>

<label>
Senha
</label>

<input
    type="password"
    id="senha"
    placeholder="Senha do painel"
    required
>

<button
    type="submit"
    id="botao"
>
🔥 GERAR OFERTA
</button>

</form>

<div
    class="status"
    id="status"
>
Processando...
</div>

<div
    class="resultado"
    id="resultado"
>

<b>🎉 Oferta enviada com sucesso!</b>

<a
    id="urlOferta"
    href="#"
    target="_blank"
>
</a>

</div>

</div>

</div>

<script>

const formulario =
    document.getElementById("ofertaForm");

const status =
    document.getElementById("status");

const resultado =
    document.getElementById("resultado");

const urlOferta =
    document.getElementById("urlOferta");

const botao =
    document.getElementById("botao");

formulario.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const produto =
            document.getElementById("produto").value.trim();

        const preco =
            document.getElementById("preco").value.trim();

        const precoAntigo =
            document.getElementById("precoAntigo").value.trim();

        const cupom =
            document.getElementById("cupom").value.trim();

        const link =
            document.getElementById("link").value.trim();

        const senha =
            document.getElementById("senha").value;

        const imagem =
            document.getElementById("imagem").files[0];

        if(!imagem){

            alert("Selecione uma imagem.");

            return;
        }

        /*
         * Gera o slug automaticamente
         */

        let slug =
            produto
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g,"")
                .replace(/[^a-z0-9]+/g,"-")
                .replace(/^-+|-+$/g,"");

        /*
         * Monta o formulário
         */

        const dados =
            new FormData();

        dados.append(
            "produto",
            produto
        );

        dados.append(
            "preco",
            preco
        );

        dados.append(
            "precoAntigo",
            precoAntigo
        );

        dados.append(
            "cupom",
            cupom
        );

        dados.append(
            "link",
            link
        );

        dados.append(
            "slug",
            slug
        );

        dados.append(
            "senha",
            senha
        );

        dados.append(
            "imagem",
            imagem
        );

        /*
         * Interface
         */

        botao.disabled = true;

        botao.textContent =
            "⏳ GERANDO OFERTA...";

        status.style.display =
            "block";

        status.classList.remove("erro");

        status.textContent =
            "🐶 Enviando oferta...";

        resultado.style.display =
            "none";

        try{

            const resposta =
                await fetch(
                    "https://holy-pine-e7fc.bernard-shimizu.workers.dev/",
                    {
                        method:"POST",
                        body:dados
                    }
                );

            const texto =
                await resposta.text();

            if(!resposta.ok){

                throw new Error(texto);

            }

            const dadosResposta =
                JSON.parse(texto);

            status.textContent =
                "🚀 Oferta enviada! Aguardando publicação...";

            resultado.style.display =
                "block";

            urlOferta.href =
                dadosResposta.url;

            urlOferta.textContent =
                dadosResposta.url;

            botao.textContent =
                "🔥 GERAR OUTRA OFERTA";

        }catch(erro){

            status.classList.add("erro");

            status.textContent =
                "❌ " + erro.message;

            botao.textContent =
                "TENTAR NOVAMENTE";

        }finally{

            botao.disabled =
                false;

        }

    }
);

</script>

</body>

</html>
