<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ofertas ativas | Farejadinhos da Yang</title>
<link rel="icon" href="../assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
    --red:#E5232E;
    --red-dark:#C21A24;
    --orange:#F7941D;
    --cream:#FDF3E3;
    --cream-2:#FFFAF1;
    --ink:#2B1B12;
    --muted:#8A7563;
    --line:#F0DFC4;
}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--cream);font-family:'Work Sans',Arial,sans-serif;color:var(--ink)}
.container{max-width:720px;margin:auto}
.header{text-align:center;margin-bottom:20px}
.header h1{font-size:20px;margin:0 0 4px;font-family:'Baloo 2',sans-serif;color:var(--red-dark)}
.header p{color:var(--muted);margin:0;font-size:13px}
.voltar{display:inline-block;margin-bottom:16px;color:var(--red-dark);font-weight:700;text-decoration:none;font-size:14px}
.senhaBox{background:var(--cream-2);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;box-shadow:0 6px 20px rgba(43,27,18,.08)}
.senhaBox label{display:block;font-weight:700;margin-bottom:8px;font-size:14px}
.senhaBox input{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:9px;font-size:15px;outline:none;font-family:'Work Sans',sans-serif;background:#fff;color:var(--ink)}
.senhaBox input:focus{border-color:var(--red)}
.lista{display:flex;flex-direction:column;gap:12px}
.item{background:var(--cream-2);border:1.5px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(43,27,18,.08);display:flex;gap:12px;align-items:center}
.item img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#f0e6d6;flex-shrink:0}
.item .info{flex:1;min-width:0}
.item h3{font-size:14px;margin:0 0 4px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Work Sans',sans-serif}
.item .preco{font-size:15px;font-weight:800;margin-bottom:4px;font-family:'Baloo 2',sans-serif;color:var(--red-dark)}
.item .melhorPreco{font-size:11.5px;color:#1c6b2c;font-weight:700;margin-bottom:6px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;text-transform:uppercase}
.badgeAtiva{background:#eafbea;color:#1a7d1a}
.badgeExpirada{background:#f1f1f1;color:#888}
.badgeCategoria{background:#fff6e9;color:var(--red-dark)}
.badgeDestaque{background:#fff8e1;color:#b8860b}
.remover{background:#fff0f0;color:#b00000;border:1.5px solid #ffd0d0;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Work Sans',sans-serif}
.remover:hover{background:#ffe0e0}
.remover:disabled{opacity:.5;cursor:wait}
.vazio{text-align:center;color:var(--muted);padding:40px 0}
.statusGeral{display:none;text-align:center;padding:10px;border-radius:10px;margin-bottom:14px;font-size:13px}
.statusGeral.erro{display:block;background:#fff0f0;color:#b00000}
.statusGeral.sucesso{display:block;background:#eafbea;color:#1a7d1a}
</style>
</head>
<body>

<div class="container">

<a class="voltar" href="index.html">← Voltar pro gerador</a>

<div class="header">
<h1>📋 Ofertas ativas</h1>
<p>Todas as ofertas — ativas e expiradas — com opção de remover antes da hora</p>
</div>

<div class="senhaBox">
<label>Senha do painel (só precisa pra remover)</label>
<input type="password" id="senha" placeholder="Senha do painel">
</div>

<div class="statusGeral" id="statusGeral"></div>

<div class="lista" id="lista"></div>

<div class="vazio" id="vazio" style="display:none">Nenhuma oferta cadastrada ainda.</div>

</div>

<script>

const WORKER_URL =
    "https://holy-pine-e7fc.bernard-shimizu.workers.dev";

const HORAS_EXPIRACAO = 24;

let ofertas = [];

function escapeHtml(texto){
  const div = document.createElement("div");
  div.textContent = texto == null ? "" : texto;
  return div.innerHTML;
}

function estaAtiva(oferta){
  const dataOferta = new Date(oferta.data);
  if(isNaN(dataOferta)) return true;
  const horas = (new Date() - dataOferta) / (1000 * 60 * 60);
  return horas <= HORAS_EXPIRACAO;
}

function paraNumero(valor){
  if(valor === undefined || valor === null || valor === "") return null;
  const n = parseFloat(String(valor).replace(/\./g,"").replace(",","."));
  return isNaN(n) ? null : n;
}

function melhorPrecoTexto(oferta){
  const av = paraNumero(oferta.precoAVista);
  const ap = paraNumero(oferta.precoAPrazo);

  if(av === null && ap === null) return "";

  if(av !== null && ap !== null){
    const menor = Math.min(av, ap);
    const rotulo = menor === av ? "à vista" : "a prazo";
    return `<div class="melhorPreco">💰 Melhor preço: R$ ${menor.toFixed(2).replace(".", ",")} (${rotulo})</div>`;
  }

  const unico = av !== null ? av : ap;
  const rotuloUnico = av !== null ? "à vista" : "a prazo";
  return `<div class="melhorPreco">💰 Preço ${rotuloUnico}: R$ ${unico.toFixed(2).replace(".", ",")}</div>`;
}

function horasRestantes(oferta){
  const dataOferta = new Date(oferta.data);
  if(isNaN(dataOferta)) return HORAS_EXPIRACAO;
  const horasPassadas = (new Date() - dataOferta) / (1000 * 60 * 60);
  return Math.max(0, HORAS_EXPIRACAO - horasPassadas);
}

async function carregar(){

  let todas = [];

  try{
    const resp = await fetch("../ofertas.json", { cache: "no-store" });
    todas = await resp.json();
  }catch(e){
    todas = [];
  }

  if(!Array.isArray(todas)){
    todas = [todas];
  }

  todas.sort((a, b) => new Date(b.data) - new Date(a.data));

  ofertas = todas;
  render();
}

function render(){

  const lista = document.getElementById("lista");
  const vazio = document.getElementById("vazio");

  lista.innerHTML = "";

  if(ofertas.length === 0){
    vazio.style.display = "block";
    return;
  }

  vazio.style.display = "none";

  ofertas.forEach(o => {

    try {

      const semDados = !o.produto && !o.preco && !o.imagem;

      const ativa = estaAtiva(o);
      const restante = horasRestantes(o);

      const statusBadge = semDados
        ? `<span class="badge badgeExpirada">⚠️ Sem dados</span>`
        : ativa
          ? `<span class="badge badgeAtiva">🟢 Ativa · expira em ${restante.toFixed(1)}h</span>`
          : `<span class="badge badgeExpirada">⚪ Expirada</span>`;

      const categoriaBadge = o.categoria
        ? `<span class="badge badgeCategoria">${escapeHtml(o.categoria)}</span>`
        : "";

      const destaqueBadge = o.destaque
        ? `<span class="badge badgeDestaque">⭐ Destaque</span>`
        : "";

      const nomeProduto = o.produto || "(sem nome — entrada incompleta)";
      const precoExibido = o.preco || "—";
      const imagemSrc = o.imagem
        ? `../assets/${encodeURIComponent(o.imagem)}`
        : "../assets/placeholder.svg";

      const melhorPrecoHtml = melhorPrecoTexto(o);

      const item = document.createElement("div");
      item.className = "item";

      item.innerHTML = `
        <img src="${imagemSrc}" alt="${escapeHtml(nomeProduto)}" onerror="this.src='../assets/placeholder.svg'">
        <div class="info">
          <h3>${escapeHtml(nomeProduto)}</h3>
          <div class="preco">${escapeHtml(precoExibido)}</div>
          ${melhorPrecoHtml}
          <div class="badges">${statusBadge}${categoriaBadge}${destaqueBadge}</div>
        </div>
        <button class="remover" type="button">🗑️ Remover</button>
      `;

      item.querySelector(".remover").addEventListener("click", function(){
        removerOferta(o.slug, this);
      });

      lista.appendChild(item);

    } catch (erroItem) {

      // Uma entrada malformada não pode travar a lista inteira —
      // mostra um card de erro em vez de quebrar tudo.
      const itemErro = document.createElement("div");
      itemErro.className = "item";
      itemErro.innerHTML = `
        <div class="info">
          <h3>⚠️ Entrada com erro (slug: ${escapeHtml(o.slug || "desconhecido")})</h3>
          <div class="badges"><span class="badge badgeExpirada">Dados inválidos</span></div>
        </div>
        <button class="remover" type="button">🗑️ Remover</button>
      `;
      itemErro.querySelector(".remover").addEventListener("click", function(){
        removerOferta(o.slug, this);
      });
      lista.appendChild(itemErro);
    }
  });
}

async function removerOferta(slug, botao){

  const senha = document.getElementById("senha").value;
  const statusGeral = document.getElementById("statusGeral");

  if(!senha){
    alert("Digite a senha do painel primeiro.");
    return;
  }

  if(!confirm("Remover essa oferta da listagem? O link individual continua funcionando.")){
    return;
  }

  botao.disabled = true;
  botao.textContent = "Removendo...";

  const dados = new FormData();
  dados.append("senha", senha);
  dados.append("slug", slug);

  try{

    const resposta = await fetch(WORKER_URL + "/remover", {
      method: "POST",
      body: dados
    });

    const texto = await resposta.text();

    if(!resposta.ok){
      throw new Error(texto);
    }

    ofertas = ofertas.filter(o => o.slug !== slug);
    render();

    statusGeral.className = "statusGeral sucesso";
    statusGeral.textContent = "✅ Oferta removida.";
    setTimeout(() => { statusGeral.className = "statusGeral"; }, 2500);

  }catch(erro){

    statusGeral.className = "statusGeral erro";
    statusGeral.textContent = "❌ " + erro.message;

    botao.disabled = false;
    botao.textContent = "🗑️ Remover";
  }
}

carregar();

</script>

</body>
</html>
